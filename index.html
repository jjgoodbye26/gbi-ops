// ── Storage — Google Sheets backend with localStorage fallback ────────────────
const storage={
  // LOCAL fallback
  _localGetAll(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch{return[];}},
  _localSave(record){const all=this._localGetAll();all.push(record);localStorage.setItem(STORAGE_KEY,JSON.stringify(all));},
  _localDelete(id){const all=this._localGetAll().filter(r=>r.id!==id);localStorage.setItem(STORAGE_KEY,JSON.stringify(all));},
  _localClear(){localStorage.removeItem(STORAGE_KEY);},

  // REMOTE via Apps Script
  async getAll(){
    if(!API_URL) return this._localGetAll();
    try{
      const res=await fetch(`${API_URL}?action=list`);
      const data=await res.json();
      return Array.isArray(data)?data:[];
    }catch{return this._localGetAll();}
  },
  async save(record){
    this._localSave(record); // always cache locally too
    if(!API_URL) return;
    try{
      await fetch(API_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({...record,action:"save"})});
    }catch{}
  },
  async delete(id){
    this._localDelete(id);
    if(!API_URL) return;
    try{
      await fetch(`${API_URL}?action=delete&id=${encodeURIComponent(id)}`);
    }catch{}
  },
  async clear(){
    this._localClear();
    if(!API_URL) return;
    try{
      await fetch(`${API_URL}?action=clear`);
    }catch{}
  },
};

// ── Helpers ───────────────────────────────────────────────────────────────────
function today(){return new Date().toISOString().slice(0,10);}
function fmtDateFull(d){if(!d)return"";const[y,m,day]=d.split("-");return`${m}/${day}/${y}`;}
function fmtDate(d){if(!d)return"";const[y,m,day]=d.split("-");return`${m}/${day}`;}
function dayLabel(d){return["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(d+"T12:00:00").getDay()];}
function getWeekDates(offset=0){
  const now=new Date();const day=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-((day===0?7:day)-1)+(offset*7));
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d.toISOString().slice(0,10);});
}
function weekLabel(dates){return`${fmtDateFull(dates[0])} — ${fmtDateFull(dates[6])}`;}
function sumField(reports,roleId,field){return reports.filter(r=>r.roleId===roleId).reduce((s,r)=>s+(parseInt(r[field])||0),0);}
function yesRate(reports,roleId,field){
  const rel=reports.filter(r=>r.roleId===roleId&&(r[field]==="Yes"||r[field]==="No"));
  if(!rel.length)return null;
  return Math.round((rel.filter(r=>r[field]==="Yes").length/rel.length)*100);
}
function escCsv(v){return`"${String(v||"").replace(/"/g,'""')}`+'"';}

            <input type="text" value={form.reporter||""} onChange={e=>set("reporter",e.target.value)} style={inp} placeholder="First and last name"/>
          </div>

          {sections.map(sec=>(
            <div key={sec.section} style={{marginBottom:32}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
                <div style={{flex:1,height:1,background:BORDER}}/>
                <div style={{fontSize:11,fontWeight:700,color:role.color,letterSpacing:"0.12em",textTransform:"uppercase",whiteSpace:"nowrap"}}>{sec.section}</div>
                <div style={{flex:1,height:1,background:BORDER}}/>
              </div>
              {sec.fields.map(f=>(
                <div key={f.key} style={{marginBottom:18}}>
                  <label style={lbl}>{f.label}{f.required&&<span style={{color:ACCENT,marginLeft:4}}>*</span>}</label>
                  {f.type==="yesno"&&(
                    <div style={{display:"flex",gap:8}}>
                      {["Yes","No"].map(opt=>(
                        <button key={opt} onClick={()=>set(f.key,opt)}
                          style={btn({flex:1,background:form[f.key]===opt?(opt==="Yes"?"#1C3E2A":"#3E1C1C"):SURFACE2,border:`1px solid ${form[f.key]===opt?(opt==="Yes"?GREEN:RED):BORDER}`,color:form[f.key]===opt?(opt==="Yes"?GREEN:RED):MUTED,padding:"10px 0",fontSize:14})}>
                          {opt==="Yes"?"✅ Yes":"❌ No"}
                        </button>
                      ))}
                    </div>
                  )}
                  {f.type==="yesno_na"&&(
                    <div style={{display:"flex",gap:8}}>
                      {["Yes","No","N/A"].map(opt=>(
                        <button key={opt} onClick={()=>set(f.key,opt)}
                          style={btn({flex:1,background:form[f.key]===opt?"#1C2A3A":SURFACE2,border:`1px solid ${form[f.key]===opt?BLUE:BORDER}`,color:form[f.key]===opt?BLUE:MUTED,padding:"10px 0",fontSize:13})}>
                          {opt}
                        </button>
                      ))}
                    </div>
                  )}
                  {f.type==="number"&&<input type="number" min="0" placeholder={f.placeholder} value={form[f.key]||""} onChange={e=>set(f.key,e.target.value)} style={inp}/>}
                  {f.type==="text"&&<input type="text" placeholder={f.placeholder} value={form[f.key]||""} onChange={e=>set(f.key,e.target.value)} style={inp}/>}
                  {f.type==="textarea"&&<textarea rows={3} placeholder={f.placeholder} value={form[f.key]||""} onChange={e=>set(f.key,e.target.value)} style={{...inp,resize:"vertical",lineHeight:1.5}}/>}
                  {f.type==="select"&&(
                    <select value={form[f.key]||""} onChange={e=>set(f.key,e.target.value)} style={{...inp,cursor:"pointer"}}>
                      <option value="">— Select —</option>
                      {f.options.map(o=><option key={o} value={o}>{o}</option>)}
                    </select>
                  )}
                </div>
              ))}
            </div>
          ))}

          <button onClick={submit} disabled={submitting}
            style={btn({background:submitting?MUTED:ACCENT,color:DARK,padding:"16px 0",width:"100%",fontSize:15,letterSpacing:"0.05em",marginTop:8,cursor:submitting?"not-allowed":"pointer"})}>
            {submitting?"Submitting...":"Submit Daily Report →"}
          </button>
        </div>
      </div>
    );
  }

  // ── ADMIN ───────────────────────────────────────────────────────────────────
  if(view==="admin"){
    if(!adminUnlocked)return(
      <div style={{minHeight:"100vh",background:DARK,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:"'DM Sans',sans-serif",padding:24}}>
        <div style={{textAlign:"center",maxWidth:320,width:"100%"}}>
          <div style={{fontSize:30,marginBottom:14}}>🔒</div>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:28,color:TEXT,letterSpacing:"0.05em",marginBottom:8}}>ADMIN ACCESS</div>
          <div style={{color:MUTED,fontSize:12,marginBottom:20}}>JJ & Yuli only</div>
          <input type="password" placeholder="Enter PIN" value={adminPin} onChange={e=>setAdminPin(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&unlock()}
            style={{...inp,textAlign:"center",fontSize:20,letterSpacing:"0.3em",marginBottom:10}}/>
          {pinErr&&<div style={{color:RED,fontSize:12,marginBottom:10}}>Incorrect PIN</div>}
          <button onClick={unlock} style={btn({background:ACCENT,color:DARK,padding:"12px 0",width:"100%",fontSize:14,marginBottom:10})}>Enter</button>
          <button onClick={()=>setView("home")} style={btn({background:"none",color:MUTED,fontSize:12})}>← Back</button>
        </div>
      </div>
    );

    // Detail view
    if(selected){
      const r=selected;
      const roleObj=ROLES.find(x=>x.id===r.roleId);
      const sections=ROLE_FIELDS[r.roleId]||[];
      return(
        <div style={{minHeight:"100vh",background:DARK,fontFamily:"'DM Sans',sans-serif",paddingBottom:60}}>
          <div style={{background:SURFACE,borderBottom:`1px solid ${BORDER}`,padding:"16px 24px",display:"flex",alignItems:"center",gap:14,position:"sticky",top:0,zIndex:10}}>
            <button onClick={()=>setSelected(null)} style={btn({background:"none",color:MUTED,fontSize:18,padding:0})}>←</button>
            <div style={{fontSize:20}}>{roleObj?.icon}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:10,color:roleObj?.color,letterSpacing:"0.15em",textTransform:"uppercase",fontWeight:700}}>{r.roleLabel}</div>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,color:TEXT}}>{r.reporter} — {fmtDateFull(r.date)}</div>
            </div>
            <button onClick={()=>deleteRpt(r.id)} style={btn({background:"transparent",border:`1px solid ${RED}`,color:RED,padding:"8px 14px",fontSize:12})}>Delete</button>
          </div>
          <div style={{maxWidth:600,margin:"0 auto",padding:"24px 20px"}}>
            {sections.map(sec=>(
              <div key={sec.section} style={{marginBottom:28}}>
                <div style={{fontSize:11,fontWeight:700,color:roleObj?.color,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:14,paddingBottom:8,borderBottom:`1px solid ${BORDER}`}}>{sec.section}</div>
                {sec.fields.map(f=>(
                  <div key={f.key} style={{marginBottom:14}}>
                    <div style={lbl}>{f.label}</div>
                    <div style={{color:r[f.key]?TEXT:MUTED,fontSize:14,background:SURFACE2,border:`1px solid ${BORDER}`,borderRadius:8,padding:"10px 14px",whiteSpace:"pre-wrap"}}>{r[f.key]||"—"}</div>
                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ── WEEKLY SUMMARY ────────────────────────────────────────────────────────
    function WeeklySummary(){
      const wr=weekReports;
      const submittedOn=(roleId,date)=>wr.some(r=>r.roleId===roleId&&r.date===date);
      const soleConfirmedOn=(date)=>wr.some(r=>r.roleId==="sole"&&r.date===date&&r.laszlo_report_reviewed==="Yes");

      const metrics=[
        {label:"Units Received",value:sumField(wr,"laszlo","units_received"),icon:"📦",color:ACCENT},
        {label:"Units in IMS",value:sumField(wr,"jonathan","units_entered"),icon:"📋",color:GREEN},
        {label:"Orders Assigned",value:sumField(wr,"laszlo","orders_assigned"),icon:"📋",color:PURPLE},
        {label:"Orders Completed",value:sumField(wr,"laszlo","orders_completed"),icon:"✅",color:GREEN},
        {label:"QA Sign-offs",value:sumField(wr,"laszlo","qa_signoffs"),icon:"✅",color:ORANGE},
        {label:"QA Failures",value:sumField(wr,"laszlo","qa_failures"),icon:"⚠️",color:RED},
        {label:"Shows Completed",value:sumField(wr,"michelle","p1_shows_completed")+sumField(wr,"michelle","p2_shows_completed"),icon:"🎬",color:RED},
        {label:"Wholesale Pallets",value:sumField(wr,"sole","wholesale_fulfilled"),icon:"🏭",color:ACCENT},
      ];

      const assigned=sumField(wr,"laszlo","orders_assigned");
      const completed=sumField(wr,"laszlo","orders_completed");
      const completionRate=assigned>0?Math.round((completed/assigned)*100):null;
      const qaTotal=sumField(wr,"laszlo","qa_signoffs")+sumField(wr,"laszlo","qa_failures");
      const qaPass=qaTotal>0?Math.round((sumField(wr,"laszlo","qa_signoffs")/qaTotal)*100):null;

      const flagFields=["escalations","blockers_flagged","damaged_items","expired_items","adjustment_details","qa_failure_details","recurring_issues","ims_errors","low_stock_flags","laszlo_discrepancies","process_gaps","p1_manifest_issues","p2_manifest_issues","flashes_missing","bottlenecks"];
      const allFlags=[];
      wr.forEach(r=>{
        const roleObj=ROLES.find(x=>x.id===r.roleId);
        flagFields.forEach(f=>{
          const val=r[f];
          if(val&&val.toLowerCase()!=="none"&&val.trim()!==""){
            allFlags.push({roleObj,reporter:r.reporter,date:r.date,field:f,value:val});
          }
        });
      });

      const sopChecks=[
        {role:"laszlo",field:"bol_verified",label:"BOL Verified (Receiving)"},
        {role:"laszlo",field:"vendor_names_removed",label:"Vendor Names Removed"},
        {role:"laszlo",field:"expiry_checked",label:"Expiry Dates Checked"},
        {role:"laszlo",field:"adjustments_submitted",label:"IMS Adjustments Submitted"},
        {role:"laszlo",field:"jj_notified",label:"JJ Notified on Order Completion"},
        {role:"laszlo",field:"payment_confirmed",label:"Payment Confirmed Before Release"},
        {role:"laszlo",field:"no_order_left_without_qa",label:"No Orders Without QA Sign-off"},
        {role:"michelle",field:"labels_verified",label:"Labels Verified (Shipping)"},
        {role:"sole",field:"laszlo_report_reviewed",label:"Sole Confirmed Laszlo's Report"},
        {role:"jonathan",field:"system_matches_physical",label:"IMS Matches Physical Count"},
      ];

      return(
        <div style={{maxWidth:780,margin:"0 auto",padding:"24px 20px"}}>
          {/* Week nav */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:24}}>
            <button onClick={()=>setWeekOffset(w=>w-1)} style={btn({background:SURFACE2,border:`1px solid ${BORDER}`,color:TEXT,padding:"8px 16px",fontSize:13})}>← Prev</button>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:11,color:ACCENT,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:4}}>{weekOffset===0?"This Week":weekOffset===-1?"Last Week":`${Math.abs(weekOffset)} Weeks Ago`}</div>
              <div style={{color:TEXT,fontSize:14,fontWeight:600}}>{weekLabel(weekDates)}</div>
              <div style={{color:MUTED,fontSize:12,marginTop:2}}>{wr.length} report{wr.length!==1?"s":""} submitted</div>
            </div>
            <button onClick={()=>setWeekOffset(w=>Math.min(0,w+1))} disabled={weekOffset===0}
              style={btn({background:weekOffset===0?SURFACE:SURFACE2,border:`1px solid ${BORDER}`,color:weekOffset===0?MUTED:TEXT,padding:"8px 16px",fontSize:13,cursor:weekOffset===0?"not-allowed":"pointer"})}>
              Next →
            </button>
          </div>

          {/* Submission tracker */}
          <div style={{...card(),marginBottom:20}}>
            <div style={{fontSize:11,color:ACCENT,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:16}}>Daily Submission & Confirmation Tracker</div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                <thead>
                  <tr>
                    <th style={{textAlign:"left",padding:"6px 8px",color:MUTED,fontWeight:600,minWidth:120}}></th>
                    {weekDates.map(d=>(
                      <th key={d} style={{textAlign:"center",padding:"6px 4px",color:d===today()?ACCENT:MUTED,fontWeight:d===today()?700:600,minWidth:48}}>
                        <div>{dayLabel(d)}</div>
                        <div style={{fontSize:10}}>{fmtDate(d)}</div>
                      </th>
                    ))}
                    <th style={{textAlign:"center",padding:"6px 4px",color:MUTED,fontWeight:600}}>5-Day</th>
                  </tr>
                </thead>
                <tbody>
                  {ROLES.map(r=>{
                    const counts=weekDates.map(d=>submittedOn(r.id,d));
                    const total=counts.filter((_,i)=>i<5).filter(Boolean).length;
                    return(
                      <tr key={r.id}>
                        <td style={{padding:"8px 8px",color:r.color,fontWeight:700,fontSize:13,whiteSpace:"nowrap"}}>{r.icon} {r.label}</td>
                        {counts.map((sub,i)=>(
                          <td key={i} style={{textAlign:"center",padding:"8px 4px"}}>
                            {weekDates[i]>today()
                              ?<span style={{color:BORDER}}>·</span>
                              :sub?<span style={{color:GREEN,fontSize:15}}>✓</span>
                              :<span style={{color:i<5?"#E05C5C55":BORDER,fontSize:15}}>○</span>}
                          </td>
                        ))}
                        <td style={{textAlign:"center",padding:"8px 4px"}}>
                          <span style={{fontSize:13,fontWeight:700,color:total===5?GREEN:total>0?ORANGE:RED}}>{total}/5</span>
                        </td>
                      </tr>
                    );
                  })}
                  <tr style={{borderTop:`1px dashed ${BORDER}`}}>
                    <td style={{padding:"8px 8px",color:MUTED,fontSize:12,fontStyle:"italic"}}>↳ Sole confirmed Laszlo</td>
                    {weekDates.map((d,i)=>(
                      <td key={i} style={{textAlign:"center",padding:"8px 4px"}}>
                        {d>today()?<span style={{color:BORDER}}>·</span>
                        :soleConfirmedOn(d)?<span style={{color:GREEN,fontSize:13}}>✓</span>
                        :<span style={{color:i<5?"#E05C5C33":BORDER,fontSize:13}}>○</span>}
                      </td>
                    ))}
                    <td style={{textAlign:"center",padding:"8px 4px",color:MUTED,fontSize:12}}>
                      {weekDates.filter((d,i)=>i<5&&d<=today()&&soleConfirmedOn(d)).length}/
                      {weekDates.filter((d,i)=>i<5&&d<=today()).length}
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          {/* Key numbers */}
          <div style={{fontSize:11,color:ACCENT,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}>Weekly Operations Numbers</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:10}}>
            {metrics.map(m=>(
              <div key={m.label} style={{...card(),textAlign:"center",padding:"14px 10px"}}>
                <div style={{fontSize:18,marginBottom:4}}>{m.icon}</div>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:30,color:m.value>0?m.color:MUTED,letterSpacing:"0.04em",lineHeight:1}}>{m.value}</div>
                <div style={{fontSize:11,color:MUTED,marginTop:4,lineHeight:1.3}}>{m.label}</div>
              </div>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:24}}>
            <div style={{...card(),display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:11,color:MUTED,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>Pick & Pack Completion</div>
                <div style={{fontSize:13,color:MUTED}}>{completed} of {assigned} orders</div>
              </div>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:36,color:completionRate===null?MUTED:completionRate>=95?GREEN:completionRate>=80?ORANGE:RED}}>
                {completionRate===null?"—":completionRate+"%"}
              </div>
            </div>
            <div style={{...card(),display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:11,color:MUTED,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>QA Pass Rate</div>
                <div style={{fontSize:13,color:MUTED}}>{sumField(wr,"laszlo","qa_failures")} failures this week</div>
              </div>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:36,color:qaPass===null?MUTED:qaPass>=95?GREEN:qaPass>=80?ORANGE:RED}}>
                {qaPass===null?"—":qaPass+"%"}
              </div>
            </div>
          </div>

          {/* SOP Compliance */}
          <div style={{...card(),marginBottom:24}}>
            <div style={{fontSize:11,color:ACCENT,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:16}}>SOP Compliance This Week</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {sopChecks.map(c=>{
                const rate=yesRate(weekReports,c.role,c.field);
                const roleObj=ROLES.find(r=>r.id===c.role);
                return(
                  <div key={c.label} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:SURFACE2,borderRadius:8}}>
                    <div>
                      <div style={{fontSize:10,color:roleObj?.color,fontWeight:700,marginBottom:2}}>{roleObj?.icon} {roleObj?.label}</div>
                      <div style={{fontSize:12,color:TEXT}}>{c.label}</div>
                    </div>
                    <div style={{fontSize:16,fontWeight:700,color:rate===null?MUTED:rate===100?GREEN:rate>=80?ORANGE:RED,minWidth:40,textAlign:"right"}}>
                      {rate===null?"—":rate+"%"}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Flags */}
          <div style={{fontSize:11,color:RED,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}>⚠ Flags & Escalations ({allFlags.length})</div>
          {allFlags.length===0
            ?<div style={{...card(),color:GREEN,fontSize:14,textAlign:"center",padding:24}}>✅ No flags or escalations this week.</div>
            :allFlags.map((e,i)=>(
              <div key={i} style={{...card(),borderLeft:`3px solid ${e.roleObj?.color||RED}`,marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:11,color:e.roleObj?.color,fontWeight:700,textTransform:"uppercase"}}>{e.roleObj?.icon} {e.roleObj?.label}</span>
                    <span style={{fontSize:11,color:MUTED}}>— {e.reporter}</span>
                  </div>
                  <span style={{fontSize:11,color:MUTED}}>{fmtDateFull(e.date)}</span>
                </div>
                <div style={{fontSize:11,color:MUTED,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>{e.field.replace(/_/g," ")}</div>
                <div style={{fontSize:14,color:TEXT,lineHeight:1.5,whiteSpace:"pre-wrap"}}>{e.value}</div>
              </div>
            ))
          }
          <div style={{marginTop:28,textAlign:"center"}}>
            <button onClick={loadReports} style={btn({background:"none",border:`1px solid ${BORDER}`,color:MUTED,padding:"8px 20px",fontSize:12})}>↻ Refresh</button>
          </div>
        </div>
      );
    }

    // ── DAILY LIST ──────────────────────────────────────────────────────────
    function DailyList(){
      return(
        <div style={{maxWidth:700,margin:"0 auto",padding:"24px 20px"}}>
          <div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap",alignItems:"center"}}>
            <button onClick={()=>setFilterRole("All")} style={btn({background:filterRole==="All"?ACCENT:"transparent",border:`1px solid ${filterRole==="All"?ACCENT:BORDER}`,color:filterRole==="All"?DARK:MUTED,padding:"6px 12px",fontSize:12})}>All</button>
            {ROLES.map(r=>(
              <button key={r.id} onClick={()=>setFilterRole(r.id)}
                style={btn({background:filterRole===r.id?r.color+"22":"transparent",border:`1px solid ${filterRole===r.id?r.color:BORDER}`,color:filterRole===r.id?r.color:MUTED,padding:"6px 12px",fontSize:12})}>
                {r.icon} {r.label}
              </button>
            ))}
            <button onClick={exportCSV} style={btn({marginLeft:"auto",background:"none",border:`1px solid ${BORDER}`,color:MUTED,padding:"6px 12px",fontSize:12})}>⬇ CSV</button>
            <button onClick={loadReports} style={btn({background:"none",border:`1px solid ${BORDER}`,color:MUTED,padding:"6px 12px",fontSize:12})}>↻</button>
          </div>
          {loading?<div style={{color:MUTED,textAlign:"center",padding:40}}>Loading...</div>
          :filtered.length===0?<div style={{color:MUTED,textAlign:"center",padding:40}}>No reports yet.</div>
          :filtered.map(r=>{
            const roleObj=ROLES.find(x=>x.id===r.roleId);
            const flagged=(r.escalations&&r.escalations.toLowerCase()!=="none"&&r.escalations.trim()!=="")
              ||(r.qa_failures&&parseInt(r.qa_failures)>0)
              ||(r.orders_delayed&&parseInt(r.orders_delayed)>0);
            const needsConfirm=r.roleId==="laszlo"&&!reports.some(x=>x.roleId==="sole"&&x.date===r.date&&x.laszlo_report_reviewed==="Yes");
            return(
              <div key={r.id} onClick={()=>setSelected(r)}
                style={{...card(),borderLeft:`3px solid ${flagged?RED:needsConfirm?ORANGE:(roleObj?.color||BORDER)}`,marginBottom:12,cursor:"pointer"}}
                onMouseOver={e=>e.currentTarget.style.background=SURFACE2}
                onMouseOut={e=>e.currentTarget.style.background=SURFACE}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                      <span style={{fontSize:11,color:roleObj?.color,fontWeight:700,textTransform:"uppercase"}}>{roleObj?.icon} {r.roleId}</span>
                      {flagged&&<span style={{fontSize:10,color:RED,fontWeight:700}}>⚠ FLAG</span>}
                      {needsConfirm&&<span style={{fontSize:10,color:ORANGE,fontWeight:700}}>⏳ AWAITING SOLE</span>}
                    </div>
                    <div style={{color:TEXT,fontWeight:700,fontSize:15,marginBottom:2}}>{r.reporter}</div>
                    <div style={{color:MUTED,fontSize:12}}>{fmtDateFull(r.date)}</div>
                  </div>
                  <div style={{textAlign:"right",color:MUTED,fontSize:12}}>
                    {r.roleId==="laszlo"&&<><div>{r.units_received||0} units received</div><div>{r.orders_completed||0}/{r.orders_assigned||0} orders</div><div>{r.qa_signoffs||0} QA · {r.qa_failures||0} fails</div></>}
                    {r.roleId==="sole"&&<div>{r.wholesale_fulfilled||0} wholesale pallets</div>}
                    {r.roleId==="jonathan"&&<div>{r.units_entered||0} in IMS</div>}
                    {r.roleId==="michelle"&&<><div>{(parseInt(r.p1_shows_completed)||0)+(parseInt(r.p2_shows_completed)||0)} shows completed</div><div style={{fontSize:11}}>{r.flashes_missing&&r.flashes_missing.toLowerCase()!=="none"?<span style={{color:RED}}>⚠ Flash/drop issue</span>:"✓ No flash issues"}</div></>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    return(
      <div style={{minHeight:"100vh",background:DARK,fontFamily:"'DM Sans',sans-serif",paddingBottom:60}}>
        {/* API Settings dialog */}
        {showApiSettings&&(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}}>
            <div style={{background:SURFACE,border:`1px solid ${BORDER}`,borderRadius:14,padding:"28px 24px",width:"100%",maxWidth:480}}>
              <div style={{fontSize:11,color:ACCENT,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:8}}>Google Sheets Connection</div>
              <div style={{color:TEXT,fontWeight:700,fontSize:16,marginBottom:6}}>Paste your Apps Script URL</div>
              <div style={{color:MUTED,fontSize:12,marginBottom:16,lineHeight:1.6}}>Deploy your Apps Script as a Web App, then paste the URL here. All future submissions will save to your Google Sheet and sync across all devices.</div>
              <input
                value={apiInput}
                onChange={e=>setApiInput(e.target.value)}
                placeholder="https://script.google.com/macros/s/..."
                style={{...inp,marginBottom:12,fontSize:12}}
              />
              <div style={{display:"flex",gap:10}}>
                <button onClick={()=>setShowApiSettings(false)} style={btn({flex:1,background:SURFACE2,border:`1px solid ${BORDER}`,color:TEXT,padding:"10px 0",fontSize:13})}>Cancel</button>
                <button onClick={()=>{
                  const url=apiInput.trim();
                  if(url){localStorage.setItem("gbi_api_url",url);}
                  else{localStorage.removeItem("gbi_api_url");}
                  window.location.reload();
                }} style={btn({flex:1,background:ACCENT,color:DARK,padding:"10px 0",fontSize:13,fontWeight:700})}>Save & Reconnect</button>
              </div>
              {apiInput&&<button onClick={()=>{setApiInput("");localStorage.removeItem("gbi_api_url");window.location.reload();}} style={btn({background:"none",color:RED,fontSize:12,marginTop:12,width:"100%"})}>Disconnect Google Sheets</button>}
            </div>
          </div>
        )}

        {/* Confirm clear dialog */}
        {confirmClear&&(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}}>
            <div style={{background:SURFACE,border:`1px solid ${BORDER}`,borderRadius:14,padding:"28px 24px",width:300,textAlign:"center"}}>
              <div style={{fontSize:24,marginBottom:10}}>⚠️</div>
              <div style={{color:TEXT,fontWeight:700,marginBottom:8}}>Clear All Data?</div>
              <div style={{color:MUTED,fontSize:13,marginBottom:20}}>This permanently deletes all reports. Cannot be undone.</div>
              <div style={{display:"flex",gap:10}}>
                <button onClick={()=>setConfirmClear(false)} style={btn({flex:1,background:SURFACE2,border:`1px solid ${BORDER}`,color:TEXT,padding:"10px 0",fontSize:13})}>Cancel</button>
                <button onClick={async()=>{await storage.clear();setReports([]);setConfirmClear(false);}} style={btn({flex:1,background:RED,color:"white",padding:"10px 0",fontSize:13})}>Clear All</button>
              </div>
            </div>
          </div>
        )}

        <div style={{background:SURFACE,borderBottom:`1px solid ${BORDER}`,padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <button onClick={()=>{setAdminUnlocked(false);setView("home");}} style={btn({background:"none",color:MUTED,fontSize:18,padding:0})}>←</button>
            <div>
              <div style={{fontSize:10,color:ACCENT,letterSpacing:"0.15em",textTransform:"uppercase",fontWeight:700}}>Admin — JJ & Yuli</div>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,color:TEXT,letterSpacing:"0.05em"}}>OPS DASHBOARD</div>
            </div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {[{id:"summary",label:"📊 Weekly"},{id:"daily",label:"📋 Daily"}].map(t=>(
              <button key={t.id} onClick={()=>setAdminTab(t.id)}
                style={btn({background:adminTab===t.id?ACCENT:"transparent",border:`1px solid ${adminTab===t.id?ACCENT:BORDER}`,color:adminTab===t.id?DARK:MUTED,padding:"7px 14px",fontSize:12})}>
                {t.label}
              </button>
            ))}
            <button onClick={()=>setShowApiSettings(true)} style={btn({background:API_URL?"#1C3E2A":"transparent",border:`1px solid ${API_URL?GREEN:BORDER}`,color:API_URL?GREEN:MUTED,padding:"7px 12px",fontSize:12})} title="Google Sheets connection">{API_URL?"🟢 Sheets":"📊 Connect Sheets"}</button>
            <button onClick={()=>setConfirmClear(true)} style={btn({background:"transparent",border:`1px solid ${BORDER}`,color:MUTED,padding:"7px 12px",fontSize:12})} title="Clear all data">🗑</button>
          </div>
        </div>
        {adminTab==="summary"?<WeeklySummary/>:<DailyList/>}
      </div>
    );
  }
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
